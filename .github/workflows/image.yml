name: Packaging image

# Publishes the packaging environment (Dockerfile: Python, zimscraperlib, package.py) as
# ghcr.io/nomdetom/docusaurus2zim, so a docs workflow elsewhere needs no Python of its own:
#
#   build.sh with DOCUSAURUS2ZIM_IMAGE=ghcr.io/nomdetom/docusaurus2zim:latest, or
#   docker run --rm -v "$PWD:/work" ghcr.io/nomdetom/docusaurus2zim --config … --build-dir …
#
# Tags: latest (main), the branch name, and sha-<commit>. Rebuilt weekly too, so the
# python:3.14-slim base picks up security fixes without a commit here.
on:
  push:
    branches: [main, docker-image]
    paths: [Dockerfile, requirements.txt, package.py, .github/workflows/image.yml]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nomdetom/docusaurus2zim
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm ghcr.io/nomdetom/docusaurus2zim:sha-$(git rev-parse --short=7 HEAD) --help | head -5
