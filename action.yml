name: docusaurus2zim
description: Build a Docusaurus site into a Kiwix ZIM for offline reading, with search over the page text only.
author: NomDeTom
branding:
  icon: book-open
  color: blue

inputs:
  build:
    description: >-
      true: build the site and package it (needs Node and the site's dependencies installed).
      false: only set up the packaging environment, for your own build.sh or package.py step.
    default: 'false'
  site-dir:
    description: The Docusaurus site's root, relative to the workspace
    default: .
  config:
    description: The docusaurus2zim.json to use, relative to site-dir
    default: docusaurus2zim.json
  name:
    description: ZIM name, also the book id in the reader URL (default from the config)
    default: ''
  title:
    description: ZIM title (default from the config)
    default: ''
  base-url:
    description: Build for this one serving prefix only (default none, a relative book that works at any mount)
    default: ''
  out-dir:
    description: Site build directory, relative to site-dir
    default: build-zim
  zim-dir:
    description: Where the .zim is written, relative to site-dir (keep it inside the workspace)
    default: zim-out
  heap:
    description: Node heap cap for the Docusaurus build, in MB
    default: '1800'
  skip-build:
    description: true to package an existing out-dir instead of building
    default: 'false'
  mode:
    description: 'How to get the packaging environment: auto (pip, else the image), pip, or image'
    default: auto
  image:
    description: Packaging image for image mode, and the auto fallback
    default: ghcr.io/nomdetom/docusaurus2zim:1

outputs:
  mode:
    description: pip or image, whichever is in use
    value: ${{ steps.pick.outputs.mode }}
  zim:
    description: The path of the .zim written (with build true)
    value: ${{ steps.build.outputs.zim }}

# After this action, either way:
#   D2Z_HOME               this repo (build.sh, package.py, relativize.mjs, examples/)
#   D2Z_PYTHON             a python with zimscraperlib: run "$D2Z_PYTHON" "$D2Z_HOME/package.py"
#   DOCUSAURUS2ZIM_PYTHON  the same, for build.sh --no-docker
runs:
  using: composite
  steps:
    - id: py
      if: inputs.mode != 'image'
      continue-on-error: true
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    - id: pip
      if: inputs.mode != 'image' && steps.py.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libmagic1 libcairo2
        python -m pip install -q -r "$GITHUB_ACTION_PATH/requirements.txt"
        python -c "import zimscraperlib"

    - id: pick
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        IMAGE: ${{ inputs.image }}
        PIP_OK: ${{ steps.pip.outcome == 'success' }}
      run: |
        home="$GITHUB_ACTION_PATH"
        if [ "$MODE" != image ] && [ "$PIP_OK" = true ]; then
          mode=pip
          py="$(command -v python)"
        else
          if [ "$MODE" = pip ]; then echo "::error::pip setup failed, and mode is pip"; exit 1; fi
          if [ "$MODE" = auto ]; then echo "::warning::pip setup failed; falling back to $IMAGE"; fi
          docker pull -q "$IMAGE"
          mode=image
          # python inside the image, with the workspace, this action and temp at their own
          # paths, so callers pass the same paths in either mode.
          py="$RUNNER_TEMP/d2z-python"
          mounts="-v \"$GITHUB_WORKSPACE:$GITHUB_WORKSPACE\" -v \"$RUNNER_TEMP:$RUNNER_TEMP\""
          # Used from another repo the action lives under _actions/ and needs its own mount;
          # used as ./ it is the workspace, and Docker rejects a duplicate mount point.
          case "$home/" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) mounts="$mounts -v \"$home:$home:ro\"" ;;
          esac
          printf '%s\n' '#!/bin/sh' \
            "exec docker run --rm -i --user \"\$(id -u):\$(id -g)\" $mounts -w \"\$PWD\" --entrypoint python \"$IMAGE\" \"\$@\"" \
            > "$py"
          chmod +x "$py"
        fi
        {
          echo "D2Z_HOME=$home"
          echo "D2Z_PYTHON=$py"
          echo "DOCUSAURUS2ZIM_PYTHON=$py"
        } >> "$GITHUB_ENV"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "docusaurus2zim: packaging with $mode ($py)"

    # build.sh packages with the python picked above (--no-docker: in image mode that python is
    # the image), and writes the book's path to this step's output.
    - id: build
      if: inputs.build == 'true'
      shell: bash
      working-directory: ${{ inputs.site-dir }}
      env:
        DOCUSAURUS2ZIM_CONFIG: ${{ inputs.config }}
        ZIM_NAME: ${{ inputs.name }}
        ZIM_TITLE: ${{ inputs.title }}
        BASE_URL: ${{ inputs.base-url }}
        OUT_DIR: ${{ inputs.out-dir }}
        ZIM_DIR: ${{ inputs.zim-dir }}
        HEAP: ${{ inputs.heap }}
        SKIP_BUILD: ${{ inputs.skip-build }}
      run: |
        args=(--no-docker --out-dir "$OUT_DIR" --zim-dir "$ZIM_DIR" --heap "$HEAP")
        if [ -n "$ZIM_NAME" ]; then args+=(--name "$ZIM_NAME"); fi
        if [ -n "$ZIM_TITLE" ]; then args+=(--title "$ZIM_TITLE"); fi
        if [ -n "$BASE_URL" ]; then args+=(--base-url "$BASE_URL"); fi
        if [ "$SKIP_BUILD" = true ]; then args+=(--skip-build); fi
        "$GITHUB_ACTION_PATH/build.sh" "${args[@]}"
